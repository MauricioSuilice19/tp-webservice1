<section class="container py-4">
  <h1 class="h3">Conversor de monedas</h1>
  <p class="text-secondary">Formulario que consulta una API para convertir montos entre monedas.</p>

  <form class="card shadow-sm p-4 conversor-form" (ngSubmit)="convertir()">
    <div class="mb-3">
      <label class="form-label" for="monto">Monto</label>
      <input id="monto" class="form-control" type="number" min="1" name="monto" [(ngModel)]="monto" />
    </div>

    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label" for="origen">Moneda origen</label>
        <select id="origen" class="form-select" name="origen" [(ngModel)]="origen">
          @for (moneda of monedas; track moneda) {
            <option [value]="moneda">{{ moneda }}</option>
          }
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label" for="destino">Moneda destino</label>
        <select id="destino" class="form-select" name="destino" [(ngModel)]="destino">
          @for (moneda of monedas; track moneda) {
            <option [value]="moneda">{{ moneda }}</option>
          }
        </select>
      </div>
    </div>

    <button class="btn btn-primary mt-4" type="submit">Convertir</button>

    @if (cargando) {
      <div class="alert alert-info mt-3">Consultando API...</div>
    }

    @if (error) {
      <div class="alert alert-danger mt-3">{{ error }}</div>
    }

    @if (resultado !== null) {
      <div class="alert alert-success mt-3 mb-0">
        {{ monto }} {{ origen }} = <strong>{{ resultado | number:'1.2-2' }} {{ destino }}</strong>
      </div>
    }
  </form>
</section>
