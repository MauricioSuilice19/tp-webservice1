<section class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="h3 mb-1">Portal de películas</h1>
      <p class="text-secondary mb-0">Listado obtenido desde un Web Service público.</p>
    </div>

    <button class="btn btn-outline-primary" (click)="obtenerPeliculas()">
      <i class="bi bi-arrow-clockwise me-1"></i>Recargar
    </button>
  </div>

  @if (cargando) {
    <div class="alert alert-info">Cargando películas desde la API...</div>
  }

  @if (error) {
    <div class="alert alert-danger">{{ error }}</div>
  }

  <div class="row g-4">
    @for (pelicula of peliculas; track pelicula.id) {
      <div class="col-12 col-md-6 col-lg-4">
        <article class="card h-100 movie-card shadow-sm">
          <img [src]="pelicula.image" class="card-img-top movie-img" [alt]="pelicula.title" />

          <div class="card-body d-flex flex-column">
            <h2 class="h5 card-title">{{ pelicula.title }}</h2>
            <p class="card-text small text-secondary flex-grow-1">{{ pelicula.description }}</p>
            <div class="d-flex flex-wrap gap-2 mt-2">
              <span class="badge text-bg-primary">{{ pelicula.year }}</span>
              <span class="badge text-bg-success">{{ pelicula.genre }}</span>
            </div>
          </div>
        </article>
      </div>
    }
  </div>
</section>
